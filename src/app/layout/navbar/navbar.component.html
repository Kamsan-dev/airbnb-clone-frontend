<div class="sticky top-0 navbar border border-b-gray-200 shadow-md">
  <p-toolbar [styleClass]="'bg-white border-t-0 border-x-0 rounded-none' + 'sm:flex sm:justify-center sm:w-full md:flex md:justify-between px-8'">
    <div class="pl-1 sm:hidden md:flex cursor-pointer p-toolbar-group-start" [routerLink]="['/']">
      <fa-icon [icon]="['fab', 'airbnb']" size="3x" class="text-primary"></fa-icon>
      <div class="font-bold text-primary pl-2 text-2xl">airbnb</div>
    </div>
    <div class="p-toolbar-group-center bg-white rounded-3xl p-0 border border-gray-300 shadow sm:hover:shadow-md items-center gap-4 flex justify-around">
      <button class="p-button rounded-l-3xl rounded-r-none border-r-0 border-0 bg-white text-gray-800 focus:shadow-none">
        {{ location }}
      </button>
      <div class="separator"></div>
      <button class="p-button border-0 rounded-none bg-white text-dark focus:shadow-none">
        {{ dates }}
      </button>
      <div class="separator"></div>
      <button class="p-button guest-btn border-0 rounded-r-3xl bg-white text-dark focus:shadow-none text-gray-400 p-2">
        <div>{{ guests }}</div>
      </button>
      <button class="mr-2 p-button search-icon flex items-center justify-center">
        <fa-icon [icon]="'search'" class="text-sm"></fa-icon>
      </button>
    </div>
    <div class="sm:hidden md:flex justify-end">
      <a class="p-button p-button-link" (click)="(null)">Airbnb your home</a>
      <p-menu #menu [model]="currentMenuItems" [popup]="true" styleClass="rounded-xl mt-1"></p-menu>
      <button
        (click)="menu.toggle($event)"
        class="menu flex items-center justify-around ml-2 pl-3 p-2 border-gray-300 focus:shadow-none hover:shadow rounded-3xl bg-white p-button"
      >
        <fa-icon [icon]="'bars'" class="text-sm text-dark mr-3"></fa-icon>
        <app-avatar [imageUrl]="" avatarSize="avatar-sm"></app-avatar>
      </button>
    </div>
  </p-toolbar>
  <app-category />
</div>
