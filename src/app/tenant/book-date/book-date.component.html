<div class="border border-gray-300 rounded-xl shadow p-4">
  <span class="text-2xl font-bold">{{ listing().price.value | currency }}</span>
  <p-calendar
    class="w-full block mt-4"
    [ngModel]="bookingDates()"
    (ngModelChange)="onDateChange($event)"
    [minDate]="minDate"
    [inline]="true"
    [touchUI]="false"
    [selectOtherMonths]="true"
    [disabledDates]="bookedDates()"
    selectionMode="range"
  >
  </p-calendar>
  <button
    class="p-button mt-4 w-full flex justify-center"
    [disabled]="!validateMakeBooking()"
    [class.opacity-50]="!validateMakeBooking()"
    (click)="onBookingClick($event)"
  >
    Reserve
  </button>
  @if (!this.authService.isAuthenticated()) {
  <div class="w-full mt-4">
    <p-message class="w-full" severity="warn" text="You need to login before making a reservation"></p-message>
  </div>
  } @if(this.authService.isAuthenticated()){
  <div class="border my-4 w-full border-solid border-gray-200"></div>
  <div class="total flex justify-between font-bold text-lg">
    <div>Total</div>
    <div>{{ totalPrice() | currency }}</div>
  </div>
  }
</div>
